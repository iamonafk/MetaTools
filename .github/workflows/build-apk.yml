name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {split($2, v, "."); if (v[1] == "1") print v[2]; else print v[1]}')
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          if [ -z "$JAVA_MAJOR_VERSION" ]; then
            echo "Error: Could not detect Java major version." >&2
            exit 1
          fi
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Detected Java version $JAVA_MAJOR_VERSION is lower than required version 17." >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR_VERSION >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Verification failed. ./debug.keystore was not created." >&2
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Validate debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            echo "Verified expected APK exists and is non-empty: $EXPECTED_APK"
            ls -lh "$EXPECTED_APK"
          else
            echo "Error: Expected APK ($EXPECTED_APK) is missing or empty." >&2
            echo "Searching only app/build/outputs/apk/ for discovered APKs:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk" >&2 || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -c 'a-zA-Z0-9._-' '-')
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          ASSET_PATH="${TMP_DIR}/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset at $ASSET_PATH is missing or empty." >&2
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Successfully prepared release asset: $ASSET_PATH ($ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH not found or is empty." >&2
            exit 1
          fi

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES=$(printf "### MetaTools Debug APK Build\n\nThis is an automatically generated GitHub Actions debug APK for testing.\n\n- **Run Number**: %s\n- **Run Attempt**: %s\n- **Source SHA**: %s\n\n> **Note**: This APK is an automated debug build intended for testing purposes only. It is not a Google Play Store production release and was signed with a temporary debug keystore." "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA")

          gh release create "$TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            RELEASE_URL=$(gh release view "$TAG" --json url --jq '.url')
            RELEASE_TITLE=$(gh release view "$TAG" --json name --jq '.name')
            echo "Tag: $TAG"
            echo "Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Release Published" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag**: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Title**: $RELEASE_TITLE" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Filename**: \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Release URL**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning ::GitHub Release publishing was not completed or failed."
            echo "Notice: The debug APK build and 'app-debug-apk' workflow artifact succeeded and remain available under the GitHub Actions run artifacts."

            echo "### ⚠️ Release Publishing Status" >> $GITHUB_STEP_SUMMARY
            echo "GitHub Release publishing did not complete. However, the APK compilation and artifact upload succeeded. You can download the APK from the **app-debug-apk** artifact on this GitHub Actions run." >> $GITHUB_STEP_SUMMARY
          fi
